<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1e1e1e">
<title>火柴人战争</title>
<link rel="stylesheet" href="./styles/main.css">
</head>
<body>

<div id="mainMenu">
  <h1>火柴人战争</h1>
  <p class="sub" id="menuSub">兵种升级 · 图标商店 · 绿方阵营</p>
  <p class="load" id="loadTip">资源加载中...</p>
  <button class="menuBtn" id="startBtn" disabled>开始战斗</button>
  <button class="menuBtn ghost" id="helpBtn">玩法说明</button>
  <p class="hint" id="menuHint">键盘 1–7 出兵 · A/D 切换攻守 · P 暂停</p>
</div>

<div id="gameUI" hidden>
  <div id="topBar">
    <span>金币 <b id="gold">120</b></span>
    <span>人口 <b id="pop">0</b>/<b id="popMax">20</b></span>
    <span class="home">我方 <b id="homeHp">1600</b></span>
    <span class="enemy">敌方 <b id="enemyHp">1600</b></span>
    <span class="clock" id="clock">00:00</span>
  </div>

  <canvas id="canvas" aria-label="战场"></canvas>

  <div id="controlBtns">
    <button class="smallBtn attackBtn" id="attackBtn" aria-pressed="false">进攻</button>
    <button class="smallBtn defendBtn" id="defendBtn" aria-pressed="true">固守</button>
    <button class="smallBtn" id="pauseBtn" aria-pressed="false">暂停</button>
    <button class="smallBtn menuBtn2" id="menuBtn">菜单</button>
  </div>

  <div id="bottomBar">
    <button class="toolBtn" id="shopBtn" aria-label="打开兵种商店">
      <svg viewBox="0 0 64 64" aria-hidden="true"><rect x="6" y="22" width="52" height="32" fill="#8b4513" stroke="#f4d16b" stroke-width="3"/><path d="M6 22 L32 6 L58 22" fill="#a0522d" stroke="#f4d16b" stroke-width="3"/><circle cx="20" cy="40" r="4" fill="#ffd24d"/><circle cx="32" cy="40" r="4" fill="#ffd24d"/><circle cx="44" cy="40" r="4" fill="#ffd24d"/></svg>
      <span>商店</span>
    </button>
    <button class="toolBtn" id="upgradeBtn" aria-label="打开升级面板">
      <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 8 L44 26 L36 26 L36 52 L28 52 L28 26 L20 26 Z" fill="#ffd24d"/></svg>
      <span>升级</span>
    </button>
    <div id="unitBar" role="group" aria-label="出兵"></div>
  </div>

  <section id="shopPanel" hidden aria-label="兵种商店">
    <h2>兵种商店 <span class="panelHint">点击卡片直接出兵</span></h2>
    <div class="shopGrid" id="shopGrid"></div>
    <button class="closeBtn" id="closeShop">关闭商店</button>
  </section>

  <section id="upgradePanel" hidden aria-label="兵种升级面板">
    <h2>兵种升级 <span class="panelHint">每级 80 金币，最高 8 级</span></h2>
    <div class="upgradeGrid" id="upgradeGrid"></div>
    <button class="closeBtn" id="closeUpgrade">关闭升级</button>
  </section>

  <div id="pauseOverlay" hidden><div class="pauseCard">已暂停<small>按 P 或点击「继续」恢复</small></div></div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
