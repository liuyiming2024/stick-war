<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1e1e1e">
<link rel="icon" href="data:,">
<title>火柴人战争</title>
<link rel="stylesheet" href="./styles/main.css?v=2.11.0">
</head>
<body>

<div id="mainMenu">
  <h1>火柴人战争</h1>
  <p class="sub" id="menuSub">兵种升级 · 图标商店 · 绿方阵营</p>
  <p class="load" id="loadTip">位图加载中...</p>
  <label class="diffRow" for="difficulty">难度
    <select id="difficulty" aria-label="选择难度"></select>
  </label>
  <button class="menuBtn" id="startBtn" disabled>开始战斗</button>
  <button class="menuBtn ghost" id="helpBtn">玩法说明</button>
  <button class="menuBtn ghost" id="statsBtn">战绩存档</button>
  <p class="hint" id="menuHint">底栏「领宝石」每局 2 次，可当金币花 · 1–7 出兵 · A/D/G 攻守驻 · P 暂停 · Esc 后退</p>
</div>

<div id="gameUI" hidden>
  <div id="topBar">
    <span>金币 <b id="gold">200</b></span>
    <span class="gemBadge" id="gemBadge" title="每局免费领 2 次；金币不足时自动 1:1 抵扣，直接当金币用">
      <span class="gemLabel">宝石</span> <b id="gems">999</b>
    </span>
    <span>人口 <b id="pop">0</b>/<b id="popMax">20</b></span>
    <span class="home">我方 <b id="homeHp">1600</b></span>
    <span class="enemy">敌方 <b id="enemyHp">1600</b></span>
    <span class="enemyDev" id="aiDev" title="敌方矿工 / 科技 / 金币">敌方发育 —</span>
    <span class="assetBadge" id="assetBadge" title="已加载的位图素材数">位图 —</span>
    <span class="ammoBadge" id="ammoBadge" title="当前箭矢，底栏可切换">普通箭</span>
    <span class="clock" id="clock">00:00</span>
  </div>

  <canvas id="canvas" aria-label="战场"></canvas>

  <div id="controlBtns">
    <button class="smallBtn attackBtn" id="attackBtn" aria-pressed="false">进攻</button>
    <button class="smallBtn defendBtn" id="defendBtn" aria-pressed="true">固守</button>
    <button class="smallBtn fortBtn" id="garrisonBtn" aria-pressed="false">驻堡</button>
    <button class="smallBtn" id="pauseBtn" aria-pressed="false">暂停</button>
    <button class="smallBtn" id="audioBtn" aria-pressed="true" title="程序合成音效开关">音效 开</button>
    <button class="smallBtn camBtn" id="camLeft" aria-label="视角左移" title="视角左移 / 拖动战场">◀</button>
    <button class="smallBtn camBtn" id="camRight" aria-label="视角右移" title="视角右移 / 拖动战场">▶</button>
    <button class="smallBtn camBtn" id="camFollow" aria-pressed="true" title="镜头跟随我方前锋">跟随</button>
    <button class="smallBtn menuBtn2" id="menuBtn">菜单</button>
  </div>

  <!-- v2.10 单兵指挥：点战场选中我方单位后出现；Esc / × / 点空处均可退出 -->
  <div id="championBar" hidden aria-label="单兵指挥">
    <span class="champTitle">指挥中 <b id="championName">—</b></span>
    <button class="champHold" id="champHoldLeft" type="button" aria-label="按住向左移动">◀</button>
    <button class="champHold" id="champHoldRight" type="button" aria-label="按住向右移动">▶</button>
    <button class="champExit" id="champExit" type="button" aria-label="退出指挥" title="退出指挥（Esc）">× 退出</button>
  </div>

  <!-- 训练队列：点条目可取消并全额退款 -->
  <div id="queueStrip" aria-label="训练队列"></div>

  <div id="bottomBar">
    <button class="toolBtn gemBtn" id="gemBtn" aria-label="领取宝石（每局最多 2 次）" title="每局免费领取 2 次，可当金币使用"><span id="gemBtnLabel">领宝石 0/2</span></button>
    <button class="toolBtn ammoBtn" id="ammoBtn" aria-label="打开箭矢切换"><span>箭矢</span></button>
    <button class="toolBtn" id="shopBtn" aria-label="打开兵种商店"><span>商店</span></button>
    <button class="toolBtn" id="upgradeBtn" aria-label="打开升级面板"><span>升级</span></button>
    <div id="unitBar" role="group" aria-label="出兵"></div>
  </div>

  <!-- 点击战场空白处即可收起下面的面板；底栏露出，方便直接切到另一个面板 -->
  <div id="panelBackdrop" hidden aria-hidden="true"></div>

  <section id="shopPanel" hidden aria-label="兵种商店">
    <button class="panelClose" id="closeShopX" type="button" aria-label="关闭兵种商店" title="关闭（Esc）">×</button>
    <h2>兵种商店 <span class="panelHint">点击卡片下单训练 · 金币不足自动用宝石抵扣</span></h2>
    <div class="shopGrid" id="shopGrid"></div>
    <button class="closeBtn" id="closeShop">关闭商店</button>
  </section>

  <section id="upgradePanel" hidden aria-label="兵种升级面板">
    <button class="panelClose" id="closeUpgradeX" type="button" aria-label="关闭兵种升级面板" title="关闭（Esc）">×</button>
    <h2>兵种升级 <span class="panelHint">每级 80 金币（可用宝石） · 矿工为背包/镐/移速</span></h2>
    <div class="upgradeGrid" id="upgradeGrid"></div>
    <button class="closeBtn" id="closeUpgrade">关闭升级</button>
  </section>

  <section id="ammoPanel" hidden aria-label="箭矢切换面板">
    <button class="panelClose" id="closeAmmoX" type="button" aria-label="关闭箭矢面板" title="关闭（Esc）">×</button>
    <h2>箭矢切换 <span class="panelHint">全局生效于我方弓箭手与城堡射手 · 每次 60 金币（可用宝石）</span></h2>
    <div class="shopGrid" id="ammoGrid"></div>
    <button class="closeBtn" id="closeAmmo">关闭箭矢</button>
  </section>

  <section id="statsPanel" hidden aria-label="战绩存档面板">
    <button class="panelClose" id="closeStatsX" type="button" aria-label="关闭战绩面板" title="关闭（Esc）">×</button>
    <h2>战绩存档 <span class="panelHint">保存在本机浏览器，清空不可恢复</span></h2>
    <div id="statsBody" class="statsBody"></div>
    <button class="closeBtn ghostBtn" id="clearStats" type="button">清空战绩</button>
    <button class="closeBtn" id="closeStats">关闭战绩</button>
  </section>

  <div id="pauseOverlay" hidden></div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script type="module" src="./src/main.js?v=2.11.0"></script>
</body>
</html>
